<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>orders · sealed &amp; co.</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23F8CFD9'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-family='Helvetica,Arial,sans-serif' font-size='20' font-weight='bold' fill='%230B4924'%3ES%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;700;800&family=Archivo:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--cream:#FFFAF5;--cream2:#FFFFFF;--ink:#0B4924;--lime:#F8CFD9;--pink:#0E6B38;--sky:#DCE9C9;--line:#F0E4D8}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--cream);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.6}
h1,h2,h3{font-family:'Hanken Grotesk',sans-serif;font-weight:800;letter-spacing:-.01em;text-transform:uppercase}
a{color:inherit}
.wrap{max-width:1060px;margin:0 auto;padding:0 24px}
.bar{background:var(--lime);color:var(--pink);text-align:center;font-family:'Hanken Grotesk',sans-serif;font-weight:800;font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:10px 14px}
nav{border-bottom:1px solid var(--line);background:var(--cream);position:sticky;top:0;z-index:10}
nav .wrap{display:flex;justify-content:space-between;align-items:center;padding:14px 24px;gap:16px;flex-wrap:wrap}
.logo{font-family:Archivo,sans-serif;font-weight:700;font-size:14px;letter-spacing:.3em;text-transform:uppercase}
.counts{font-family:'Hanken Grotesk',sans-serif;font-weight:800;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase}
main{padding:34px 0 80px}
.gate{max-width:420px;margin:60px auto;background:var(--cream2);border:1px solid var(--line);border-radius:10px;padding:26px}
.gate h2{font-size:19px}
input,select,textarea{font-family:Inter,sans-serif;font-size:15px;padding:11px 13px;border:1px solid var(--line);border-radius:8px;background:var(--cream);color:var(--ink);width:100%}
.btn{display:inline-block;background:var(--ink);color:var(--cream);border:none;border-radius:10px;padding:12px 22px;font-family:'Hanken Grotesk',sans-serif;font-weight:800;font-size:12px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.btn.ghost{background:var(--cream2);color:var(--ink);border:1px solid var(--line)}
.btn.pink{background:var(--lime);color:var(--pink)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chip{background:var(--cream2);border:1px solid var(--line);border-radius:999px;padding:7px 15px;font-family:'Hanken Grotesk',sans-serif;font-weight:800;font-size:11px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.chip.on{background:var(--lime);color:var(--pink);border-color:var(--lime)}
.order{background:var(--cream2);border:1px solid var(--line);border-radius:10px;padding:20px 22px;margin-bottom:14px}
.otop{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:baseline}
.oid{font-family:'Hanken Grotesk',sans-serif;font-weight:800;font-size:15px}
.state{display:inline-block;background:var(--sky);border-radius:999px;padding:4px 13px;font-family:'Hanken Grotesk',sans-serif;font-weight:800;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase}
.state.awaiting-payment,.state.art-missing{background:var(--lime);color:var(--pink)}
.state.handed-off{background:var(--ink);color:var(--cream)}
.grid{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;margin-top:14px}
.steps{margin-top:18px;border-top:1px solid var(--line);padding-top:16px}
.steps h4{font-family:'Hanken Grotesk',sans-serif;font-weight:800;font-size:10px;letter-spacing:.12em;text-transform:uppercase;opacity:.6;margin-bottom:12px}
.step{display:flex;gap:12px;align-items:flex-start;padding:7px 0}
.dot{flex:none;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:var(--cream);display:flex;align-items:center;justify-content:center;font-family:'Hanken Grotesk',sans-serif;font-weight:800;font-size:10px;margin-top:1px}
.step.done .dot{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.step.now .dot{background:var(--lime);color:var(--pink);border-color:var(--pink)}
.step.skip .dot{opacity:.35}
.sl{font-family:'Hanken Grotesk',sans-serif;font-weight:800;font-size:12px;letter-spacing:.03em;text-transform:uppercase}
.step.todo .sl,.step.skip .sl{opacity:.45}
.sm{font-size:12.5px;opacity:.75}
.step.now .sm{opacity:1;font-weight:600}
.step.now .sl{color:var(--pink)}
.pct{height:5px;border-radius:99px;background:var(--line);overflow:hidden;margin-bottom:16px}
.pct i{display:block;height:100%;background:var(--pink)}
.tasks{margin-top:12px;font-size:12.5px}
.tasks div{padding:2px 0}
.nowbar{background:var(--lime);border-radius:10px;padding:12px 15px;margin-top:14px;font-size:13px}
.nowbar b{font-family:'Hanken Grotesk',sans-serif;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--pink)}
.k{font-family:'Hanken Grotesk',sans-serif;font-weight:800;font-size:10px;letter-spacing:.12em;text-transform:uppercase;opacity:.6}
.v{font-size:14px;margin-bottom:10px;word-break:break-word}
.art a{font-weight:600}
.flag{color:#B02A2A;font-weight:700;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.row select{width:auto;min-width:190px}
.tl{margin-top:12px;font-size:12.5px;opacity:.8}
.tl div{padding:2px 0}
.empty{background:var(--cream2);border:1px solid var(--line);border-radius:10px;padding:40px;text-align:center}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="bar">internal · order desk</div>
<nav><div class="wrap">
  <span class="logo">sealed &amp; co.</span>
  <span class="counts" id="counts"></span>
  <button class="btn ghost" id="refresh">refresh</button>
</div></nav>
<main class="wrap">
  <div class="gate" id="gate" style="display:none">
    <h2>order desk</h2>
    <p style="margin:10px 0 14px;font-size:14px">paste your admin key to see orders.</p>
    <input type="password" id="key" placeholder="admin key" autocomplete="off">
    <button class="btn" id="go" style="margin-top:12px;width:100%">open</button>
    <p id="gateMsg" style="margin-top:10px;color:#B02A2A;font-size:13px;display:none">that key didn't work.</p>
  </div>
  <div id="app" style="display:none">
    <div class="filters" id="filters"></div>
    <div id="list"></div>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
let KEY = localStorage.getItem('sc_admin') || new URLSearchParams(location.search).get('k') || '';
let ORDERS = [], STATES = [], FILTER = 'open';

const OPEN = (o) => o.state !== 'handed-off' && o.state !== 'cancelled';
const money = (c) => '$' + ((c || 0) / 100).toLocaleString('en-CA', {minimumFractionDigits: 2});
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function load() {
  const r = await fetch('/api/orders?k=' + encodeURIComponent(KEY));
  if (r.status === 401) { localStorage.removeItem('sc_admin'); $('gate').style.display = 'block'; $('app').style.display = 'none'; $('gateMsg').style.display = KEY ? 'block' : 'none'; return; }
  const d = await r.json();
  ORDERS = d.orders || []; STATES = d.states || [];
  localStorage.setItem('sc_admin', KEY);
  if (history.replaceState) history.replaceState(null, '', '/admin.html');
  $('gate').style.display = 'none'; $('app').style.display = 'block';
  render();
}

function render() {
  const open = ORDERS.filter(OPEN).length;
  $('counts').textContent = open + ' open · ' + ORDERS.length + ' total';
  const groups = ['open', 'all'].concat(STATES.filter((s) => ORDERS.some((o) => o.state === s)));
  $('filters').innerHTML = groups.map((g) =>
    '<button class="chip' + (g === FILTER ? ' on' : '') + '" data-f="' + g + '">' + g.replace(/-/g, ' ') + '</button>').join('');
  $('filters').querySelectorAll('.chip').forEach((b) => b.onclick = () => { FILTER = b.dataset.f; render(); });

  const rows = ORDERS.filter((o) => FILTER === 'all' ? true : FILTER === 'open' ? OPEN(o) : o.state === FILTER);
  $('list').innerHTML = rows.length ? rows.map(card).join('') :
    '<div class="empty"><h3 style="font-size:18px">nothing here yet.</h3><p style="margin-top:8px;font-size:14px">orders show up the moment someone pays or requests an e-transfer.</p></div>';
  $('list').querySelectorAll('[data-adv]').forEach((b) => b.onclick = () => advance(b.dataset.adv, b.parentElement.querySelector('select').value, b.parentElement.querySelector('input').value));
  $('list').querySelectorAll('[data-quick]').forEach((b) => b.onclick = () => advance(b.dataset.quick, b.dataset.state, ''));
}

// the real pipeline, and what Leo actually does at each step. steps that don't apply
// to an order (art steps on a blank-cans order) are shown greyed as "not needed".
const PIPELINE = [
  { state: 'paid',             label: 'payment in',      art: false, todo: 'confirm the e-transfer landed, then mark it paid.' },
  { state: 'art-review',       label: 'design received', art: true,  todo: 'open the proof. does the art fill the 2x2 sticker and look sharp?' },
  { state: 'art-approved',     label: 'design approved', art: true,  todo: 'approve it - that starts their 5-7 business day clock.' },
  { state: 'supplies-ordered', label: 'supplies ordered',art: false, todo: 'order the labels and the cans (see the to-order list).' },
  { state: 'received',         label: 'everything here', art: false, todo: 'check the delivery: right label, right count, no dents.' },
  { state: 'labelled',         label: 'labels applied',  art: true,  todo: 'apply the stickers - about 45 minutes for 200.' },
  { state: 'boxed',            label: 'boxed',           art: false, todo: 'box the cans with the machine and the setup card.' },
  { state: 'handed-off',       label: 'handed off',      art: false, todo: 'deliver and set it up, then ask for a photo.' },
];

const NEEDS_ART = (o) => !!(o.design && o.design.id) ||
  (o.items || []).some(i => /brand|signature/i.test(i.name || ''));

function stepsFor(o) {
  const wantsArt = NEEDS_ART(o);
  const hist = {};
  (o.timeline || []).forEach(t => { if (t.state && !hist[t.state]) hist[t.state] = t.at; });
  const rows = PIPELINE.filter(p => wantsArt || !p.art);
  // "now" is the FIRST unfinished step, not the one after the last finished one - an
  // order can pick up its artwork before the money lands, and payment is still the gate.
  const firstOpen = rows.findIndex(p => !hist[p.state]);
  return rows.map((p, i) => {
    let status = 'todo';
    if (hist[p.state]) status = 'done';
    else if (i === firstOpen) status = 'now';
    return Object.assign({}, p, { status, at: hist[p.state] || null, n: i + 1 });
  });
}

function card(o) {
  const a = o.address || {}, d = o.design || {};
  const addr = [a.line1, a.line2, a.city, a.state, a.postal_code].filter(Boolean).join(', ');
  const steps = stepsFor(o);
  const done = steps.filter(s => s.status === 'done').length;
  const nowStep = steps.find(s => s.status === 'now');
  const waiting = o.state === 'awaiting-payment';
  const artMissing = NEEDS_ART(o) && !d.id;

  const stepHtml = steps.map(s =>
    '<div class="step ' + s.status + '">' +
      '<span class="dot">' + (s.status === 'done' ? '&#10003;' : s.n) + '</span>' +
      '<span><span class="sl">' + s.label + '</span>' +
        (s.status === 'done' ? '<span class="sm"> · ' + esc(String(s.at).slice(0, 16).replace('T', ' ')) + '</span>'
         : s.status === 'now' ? '<br><span class="sm">' + esc(s.todo) + '</span>' : '') +
      '</span>' +
    '</div>').join('');

  const nextState = waiting ? 'paid' : (nowStep ? nowStep.state : 'handed-off');

  return '<div class="order">' +
    '<div class="otop"><span class="oid">' + esc(o.id) + ' · ' + money(o.amounts && o.amounts.total) + ' · ' + esc(o.channel) + '</span>' +
      '<span class="state ' + esc(o.state) + '">' + esc(o.state).replace(/-/g, ' ') + '</span></div>' +

    '<div class="steps">' +
      '<h4>' + done + ' of ' + steps.length + ' steps done' + (o.dueBy ? ' · due ' + esc(o.dueBy) : '') + '</h4>' +
      '<div class="pct"><i style="width:' + Math.round(done / steps.length * 100) + '%"></i></div>' +
      stepHtml +
      (artMissing ? '<div class="nowbar"><b>blocked</b><br>they paid but never sent artwork. email them the upload link and nothing moves until it lands.</div>'
       : waiting ? '<div class="nowbar"><b>waiting on money</b><br>send them the e-transfer details, then mark this paid.</div>' : '') +
      ((o.supplierTasks && o.supplierTasks.length) ? '<div class="tasks"><span class="k">to order</span>' +
        o.supplierTasks.map(t => '<div>[ ] ' + esc(t.label) + '</div>').join('') + '</div>' : '') +
    '</div>' +

    '<div class="grid">' +
      '<div>' +
        '<div class="k">what they bought</div><div class="v">' + (o.items || []).map((i) => esc(i.qty + 'x ' + i.name)).join('<br>') + (o.colours ? '<br>machine: ' + esc(o.colours) : '') + '</div>' +
        '<div class="k">who</div><div class="v">' + esc(o.customer && o.customer.business || '-') + '<br>' + esc(o.customer && o.customer.name || '') + '<br>' + esc(o.customer && o.customer.email || '') + '<br>' + esc(o.customer && o.customer.phone || '') + '</div>' +
        (addr ? '<div class="k">deliver to</div><div class="v">' + esc(addr) + '</div>' : '') +
      '</div>' +
      '<div class="art">' +
        '<div class="k">their design</div><div class="v">' +
          (d.id
            ? esc(d.id) + (d.filename ? ' · ' + esc(d.filename) : '') +
              (d.width ? ' · ' + d.width + 'x' + d.height + 'px' : d.vector ? ' · vector' : '') +
              (d.warnings && d.warnings.length ? '<br><span class="flag">flag: ' + esc(d.warnings.join('; ')) + '</span>' : '') +
              '<br>' + [d.proofUrl ? '<a href="' + esc(d.proofUrl) + '" target="_blank">proof</a>' : '',
                         d.printUrl ? '<a href="' + esc(d.printUrl) + '" target="_blank">print file</a>' : '',
                         d.url ? '<a href="' + esc(d.url) + '" target="_blank">original</a>' : ''].filter(Boolean).join(' · ')
            : (NEEDS_ART(o) ? '<span class="flag">nothing uploaded yet</span>' : 'not needed for this order')) +
        '</div>' +
        '<div class="k">history</div><div class="tl">' + (o.timeline || []).map((t) =>
          '<div>' + esc(String(t.at).slice(0, 16).replace('T', ' ')) + ' · ' + esc(t.state) + (t.note ? ' · ' + esc(t.note) : '') + '</div>').join('') + '</div>' +
      '</div>' +
    '</div>' +

    '<div class="row">' +
      '<button class="btn pink" data-quick="' + esc(o.id) + '" data-state="' + esc(nextState) + '">' +
        (o.state === 'handed-off' ? 'done' : 'mark: ' + nextState.replace(/-/g, ' ')) + '</button>' +
      '<select>' + STATES.map((st) => '<option value="' + st + '"' + (st === nextState ? ' selected' : '') + '>' + st.replace(/-/g, ' ') + '</option>').join('') + '</select>' +
      '<input placeholder="note (optional)" style="flex:1;min-width:150px">' +
      '<button class="btn ghost" data-adv="' + esc(o.id) + '">update</button>' +
    '</div>' +
  '</div>';
}

async function advance(id, state, note) {
  const r = await fetch('/api/orders?k=' + encodeURIComponent(KEY), {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({id, state, note}),
  });
  if (r.ok) { setTimeout(load, 400); } else alert('could not update that order');
}

$('go').onclick = () => { KEY = $('key').value.trim(); load(); };
$('key').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('go').click(); });
$('refresh').onclick = load;
if (KEY) load(); else $('gate').style.display = 'block';
</script>
</body>
</html>
